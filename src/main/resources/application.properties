spring.application.name=gestion-polizas
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql,classpath:data-demo.sql
spring.jpa.open-in-view=false
app.api-key=${POLIZAS_API_KEY:123456}
app.core-url=${POLIZAS_CORE_URL:}
